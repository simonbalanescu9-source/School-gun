<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>School Prank 3D</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="game-ui">
    <h1>School Prank 3D</h1>
    <p id="status">Loading...</p>

    <div class="stats">
      <span>Score: <b id="score">0</b></span>
      <span>Stamina: <b id="stamina">100</b></span>
      <span>Quest: <b id="quest">Find the classroom</b></span>
    </div>

    <div class="controls">
      <p><b>Controls</b></p>
      <p>WASD = Move</p>
      <p>Mouse = Look</p>
      <p>E = Interact</p>
      <p>Shift = Run</p>
    </div>
  </div>

  <div id="crosshair">+</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
