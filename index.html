<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Splash</title>
<style>
body{margin:0;overflow:hidden;background:#111;font-family:Arial,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:white}
.panel{width:min(700px,92vw);padding:28px;border-radius:24px;background:rgba(10,20,35,.9);text-align:center}
.hidden{display:none!important}
h1{font-size:48px;margin:0 0 15px}
button{padding:14px 24px;margin:8px;border:0;border-radius:14px;background:#4cc9f0;font-weight:bold;font-size:18px;cursor:pointer}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="overlay">
  <div class="panel" id="menu">
    <h1>CLASSROOM SPLASH</h1>
    <p>You are stuck in class. Click to spray students. Avoid the teacher!</p>
    <button id="startBtn">Start Game</button>
    <button id="resetBtn">Reset Save</button>
    <p id="saveText"></p>
  </div>

  <div class="panel hidden" id="gameOver">
    <h1 id="endTitle">Caught!</h1>
    <p id="endStats"></p>
    <button id="againBtn">Play Again</button>
    <button id="menuBtn">Menu</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const gameOver = document.getElementById("gameOver");
const saveText = document.getElementById("saveText");
const endTitle = document.getElementById("endTitle");
const endStats = document.getElementById("endStats");

document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("resetBtn").addEventListener("click", resetSave);
document.getElementById("againBtn").addEventListener("click", startGame);
document.getElementById("menuBtn").addEventListener("click", showMenu);

let W, H, scale;
let state = "menu";
let score = 0;
let combo = 0;
let suspicion = 0;
let ammo = 100;
let timeLeft = 60;
let highScore = Number(localStorage.getItem("classSplashHigh") || 0);
let upgrade = Number(localStorage.getItem("classSplashUpgrade") || 0);

let students = [];
let teacher = {};
let droplets = [];
let particles = [];
let texts = [];

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  scale = Math.min(W / 1200, H / 720);
}
window.addEventListener("resize", resize);
resize();

function showMenu(){
  state = "menu";
  menu.classList.remove("hidden");
  gameOver.classList.add("hidden");
  saveText.innerHTML = `High Score: <b>${highScore}</b><br>Upgrade: <b>${upgrade}</b>`;
}

function resetSave(){
  localStorage.clear();
  highScore = 0;
  upgrade = 0;
  showMenu();
}

function startGame(){
  state = "playing";
  menu.classList.add("hidden");
  gameOver.classList.add("hidden");

  score = 0;
  combo = 0;
  suspicion = 0;
  ammo = 100;
  timeLeft = 60;
  droplets = [];
  particles = [];
  texts = [];
  students = [];

  spawnClassroom();
}

function spawnClassroom(){
  const colors = ["#ff6b6b","#ffd166","#06d6a0","#4cc9f0","#b388ff","#ff9f1c"];
  const rows = [
    {y:H*0.48, count:5},
    {y:H*0.63, count:6},
    {y:H*0.78, count:5}
  ];

  rows.forEach(row=>{
    for(let i=0;i<row.count;i++){
      const gap = W / (row.count + 1);
      students.push({
        x: gap * (i+1),
        y: row.y,
        baseX: gap * (i+1),
        color: colors[Math.floor(Math.random()*colors.length)],
        wet: 0,
        duck: 0
      });
    }
  });

  teacher = {
    x: W/2,
    y: H*0.24,
    wet: 0,
    angry: 0,
    look: 0,
    timer: 1
  };
}

function shoot(x,y){
  if(state !== "playing" || ammo <= 0) return;

  ammo -= 5;
  combo = 0;

  const gunX = W/2 + 65*scale;
  const gunY = H - 80*scale;
  const angle = Math.atan2(y-gunY, x-gunX);

  for(let i=0;i<28;i++){
    droplets.push({
      x: gunX,
      y: gunY,
      vx: Math.cos(angle + rand(-0.16,0.16)) * rand(700,1100) * scale,
      vy: Math.sin(angle + rand(-0.16,0.16)) * rand(700,1100) * scale,
      life: 0.65,
      size: rand(3,6)*scale
    });
  }

  particles.push({x,y,r:5,life:0.35});

  let hitStudent = false;

  students.forEach(s=>{
    if(Math.hypot(x-s.x, y-(s.y-s.duck)) < 58*scale){
      hitStudent = true;
      s.wet = 1;
      s.duck = 22*scale;
      combo++;
      const points = 10 + combo * 5;
      score += points;
      addText("+"+points, s.x, s.y-80*scale, "#e0fbfc");
      for(let i=0;i<14;i++) splash(s.x, s.y-35*scale);
    }
  });

  if(Math.hypot(x-teacher.x, y-teacher.y) < 78*scale){
    teacher.wet = 1;
    teacher.angry = 1;
    suspicion += 30;
    addText("TEACHER!", teacher.x, teacher.y-90*scale, "#ff595e");
    for(let i=0;i<25;i++) splash(teacher.x, teacher.y);
  } else if(!hitStudent){
    suspicion += 3;
  }
}

canvas.addEventListener("click", e => shoot(e.clientX, e.clientY));
canvas.addEventListener("touchstart", e => {
  const t = e.touches[0];
  shoot(t.clientX, t.clientY);
});

function update(dt){
  if(state !== "playing") return;

  timeLeft -= dt;
  ammo = clamp(ammo + dt*10, 0, 100);
  suspicion = clamp(suspicion - dt*4, 0, 100);

  teacher.timer -= dt;
  if(teacher.timer <= 0){
    teacher.timer = rand(0.8,2);
    teacher.look = rand(-1,1);
    suspicion += 4;
  }

  teacher.wet = Math.max(0, teacher.wet - dt*0.5);
  teacher.angry = Math.max(0, teacher.angry - dt*0.7);

  students.forEach((s,i)=>{
    s.x = s.baseX + Math.sin(Date.now()/600 + i) * 14*scale;
    s.wet = Math.max(0, s.wet - dt*0.3);
    s.duck = Math.max(0, s.duck - dt*25*scale);
  });

  droplets.forEach(d=>{
    d.x += d.vx*dt;
    d.y += d.vy*dt;
    d.vy += 550*scale*dt;
    d.life -= dt;
  });
  droplets = droplets.filter(d=>d.life>0);

  particles.forEach(p=>{
    p.r += 140*scale*dt;
    p.life -= dt;
  });
  particles = particles.filter(p=>p.life>0);

  texts.forEach(t=>{
    t.y -= 55*scale*dt;
    t.life -= dt;
  });
  texts = texts.filter(t=>t.life>0);

  if(suspicion >= 100) endGame(false);
  if(timeLeft <= 0) endGame(true);
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawRoom();
  drawTeacher();
  students.forEach(drawStudent);
  drawGun();
  drawEffects();
  drawUI();
}

function drawRoom(){
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#bde0fe");
  bg.addColorStop(0.45,"#eaf6ff");
  bg.addColorStop(0.46,"#f2d3a2");
  bg.addColorStop(1,"#9c6644");
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = "#355e3b";
  roundRect(W*0.28,H*0.06,W*0.44,H*0.2,18*scale);
  ctx.fill();

  ctx.strokeStyle = "#ddbea9";
  ctx.lineWidth = 7*scale;
  ctx.stroke();

  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.font = `${30*scale}px Arial`;
  ctx.fillText("MATH TEST TODAY", W/2, H*0.14);

  ctx.font = `${18*scale}px Arial`;
  ctx.fillText("Definitely no water guns.", W/2, H*0.18);
}

function drawStudent(s){
  drawDesk(s.x, s.y+35*scale, 105*scale, 48*scale);

  const y = s.y - s.duck;

  ctx.fillStyle = s.color;
  roundRect(s.x-30*scale,y,60*scale,70*scale,18*scale);
  ctx.fill();

  ctx.fillStyle = "#ffd6b0";
  ctx.beginPath();
  ctx.arc(s.x,y-35*scale,25*scale,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#2b1d16";
  ctx.beginPath();
  ctx.arc(s.x,y-49*scale,26*scale,Math.PI,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(s.x-8*scale,y-38*scale,3*scale,0,Math.PI*2);
  ctx.arc(s.x+8*scale,y-38*scale,3*scale,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 2*scale;
  ctx.beginPath();
  ctx.arc(s.x,y-26*scale,9*scale,0,Math.PI);
  ctx.stroke();

  if(s.wet > 0){
    ctx.fillStyle = `rgba(80,190,255,${s.wet})`;
    ctx.beginPath();
    ctx.arc(s.x+12*scale,y-45*scale,10*scale,0,Math.PI*2);
    ctx.fill();
  }
}

function drawTeacher(){
  ctx.save();
  ctx.translate(teacher.x, teacher.y);

  ctx.fillStyle = teacher.angry > 0 ? "#e63946" : "#4361ee";
  roundRect(-42*scale,0,84*scale,95*scale,18*scale);
  ctx.fill();

  ctx.fillStyle = "#ffd6b0";
  ctx.beginPath();
  ctx.arc(0,-35*scale,34*scale,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#222";
  ctx.fillRect(-36*scale,-72*scale,72*scale,16*scale);
  ctx.fillRect(-20*scale,-105*scale,40*scale,40*scale);

  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(-11*scale+teacher.look*7*scale,-40*scale,4*scale,0,Math.PI*2);
  ctx.arc(11*scale+teacher.look*7*scale,-40*scale,4*scale,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 3*scale;
  ctx.beginPath();
  ctx.arc(0,-22*scale,13*scale,Math.PI,Math.PI*2);
  ctx.stroke();

  if(teacher.wet > 0){
    ctx.fillStyle = `rgba(80,190,255,${teacher.wet})`;
    ctx.beginPath();
    ctx.arc(14*scale,-45*scale,12*scale,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

function drawDesk(x,y,w,h){
  ctx.fillStyle = "#9c6644";
  roundRect(x-w/2,y,w,h,10*scale);
  ctx.fill();

  ctx.fillStyle = "#7f4f24";
  ctx.fillRect(x-w/2+12*scale,y+h,8*scale,40*scale);
  ctx.fillRect(x+w/2-20*scale,y+h,8*scale,40*scale);
}

function drawGun(){
  ctx.fillStyle = "#6f4e37";
  roundRect(W/2-220*scale,H-120*scale,440*scale,130*scale,22*scale);
  ctx.fill();

  ctx.fillStyle = "#023e8a";
  roundRect(W/2-80*scale,H-85*scale,170*scale,38*scale,15*scale);
  ctx.fill();

  ctx.fillStyle = "#4cc9f0";
  roundRect(W/2+30*scale,H-107*scale,105*scale,24*scale,10*scale);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.font = `${18*scale}px Arial`;
  ctx.fillText("YOU CANNOT MOVE", W/2, H-145*scale);
}

function drawEffects(){
  droplets.forEach(d=>{
    ctx.fillStyle = `rgba(80,190,255,${d.life/0.65})`;
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.size,0,Math.PI*2);
    ctx.fill();
  });

  particles.forEach(p=>{
    ctx.strokeStyle = `rgba(80,190,255,${p.life/0.35})`;
    ctx.lineWidth = 4*scale;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.stroke();
  });

  texts.forEach(t=>{
    ctx.globalAlpha = t.life;
    ctx.fillStyle = t.color;
    ctx.textAlign = "center";
    ctx.font = `bold ${26*scale}px Arial`;
    ctx.fillText(t.text,t.x,t.y);
    ctx.globalAlpha = 1;
  });
}

function drawUI(){
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  roundRect(18*scale,18*scale,340*scale,140*scale,18*scale);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.textAlign = "left";
  ctx.font = `bold ${24*scale}px Arial`;
  ctx.fillText("Score: " + score, 38*scale, 55*scale);
  ctx.fillText("Time: " + Math.ceil(timeLeft), 38*scale, 90*scale);

  bar(38*scale,110*scale,280*scale,20*scale,ammo/100,"#4cc9f0","Ammo");
  bar(38*scale,138*scale,280*scale,20*scale,suspicion/100,"#ff595e","Trouble");
}

function bar(x,y,w,h,v,color,label){
  ctx.fillStyle = "rgba(255,255,255,0.2)";
  roundRect(x,y,w,h,10*scale);
  ctx.fill();

  ctx.fillStyle = color;
  roundRect(x,y,w*v,h,10*scale);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.font = `${13*scale}px Arial`;
  ctx.fillText(label,x+w/2,y+h-5*scale);
}

function splash(x,y){
  particles.push({
    x:x+rand(-20,20)*scale,
    y:y+rand(-20,20)*scale,
    r:3,
    life:0.25
  });
}

function addText(text,x,y,color){
  texts.push({text,x,y,color,life:1});
}

function rand(a,b){
  return Math.random()*(b-a)+a;
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
}

function endGame(win){
  state = "end";

  if(score > highScore){
    highScore = score;
    localStorage.setItem("classSplashHigh", highScore);
  }

  if(win && score > 500 && upgrade < 5){
    upgrade++;
    localStorage.setItem("classSplashUpgrade", upgrade);
  }

  endTitle.textContent = win ? "Class survived!" : "You got caught!";
  endStats.innerHTML = `Score: <b>${score}</b><br>High Score: <b>${highScore}</b><br>Upgrade: <b>${upgrade}</b>`;
  gameOver.classList.remove("hidden");
}

let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000,0.033);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
loop(last);
</script>
</body>
</html>
